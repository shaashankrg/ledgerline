apiVersion: v1
kind: Service
metadata:
  name: ledgerline-kafka
  namespace: ledgerline
spec:
  clusterIP: None
  # See helm/ledgerline/templates/kafka/statefulset.yaml's identical Service
  # for why this is required with 3 brokers: without it, DNS for each
  # broker's peers isn't published until that peer is Ready, but no broker
  # can become Ready without first reaching its peers via this DNS to form
  # the KRaft controller quorum -- a deadlock.
  publishNotReadyAddresses: true
  selector:
    app: ledgerline-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
    - name: internal
      port: 29092
      targetPort: 29092
---
# NodePort per broker -- see helm/ledgerline/templates/kafka/statefulset.yaml's
# identical Services for the full reasoning (a plain port-forward doesn't
# work for a real Kafka client's post-handshake reconnect, and with 3
# brokers that reconnect can land on any of them).
apiVersion: v1
kind: Service
metadata:
  name: ledgerline-kafka-0-external
  namespace: ledgerline
spec:
  selector:
    app: ledgerline-kafka
    statefulset.kubernetes.io/pod-name: ledgerline-kafka-0
  ports:
    - name: external
      port: 9094
      targetPort: 9094
      nodePort: 30094
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerline-kafka-1-external
  namespace: ledgerline
spec:
  selector:
    app: ledgerline-kafka
    statefulset.kubernetes.io/pod-name: ledgerline-kafka-1
  ports:
    - name: external
      port: 9095
      targetPort: 9095
      nodePort: 30095
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerline-kafka-2-external
  namespace: ledgerline
spec:
  selector:
    app: ledgerline-kafka
    statefulset.kubernetes.io/pod-name: ledgerline-kafka-2
  ports:
    - name: external
      port: 9096
      targetPort: 9096
      nodePort: 30096
  type: NodePort
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledgerline-kafka
  namespace: ledgerline
spec:
  serviceName: ledgerline-kafka
  # Day 10: 3 brokers, KRaft mode, replication factor 3 / min.insync.replicas
  # 2 -- see docs/day10-multi-broker.md for the full reasoning.
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: ledgerline-kafka
  template:
    metadata:
      labels:
        app: ledgerline-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
            - containerPort: 29092
            - containerPort: 9094
            - containerPort: 9095
            - containerPort: 9096
          # KAFKA_NODE_ID and KAFKA_ADVERTISED_LISTENERS must be distinct per
          # broker -- derived from $HOSTNAME's ordinal at container start,
          # same as the Helm chart's version of this StatefulSet. See that
          # file's comment for the full reasoning.
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              ordinal="${HOSTNAME##*-}"
              external_port=$((9094 + ordinal))
              export KAFKA_NODE_ID=$((ordinal + 1))
              export KAFKA_LISTENERS="PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:${external_port}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://ledgerline-kafka-${ordinal}.ledgerline-kafka.ledgerline.svc.cluster.local:9092,INTERNAL://ledgerline-kafka-${ordinal}.ledgerline-kafka.ledgerline.svc.cluster.local:29092,EXTERNAL://localhost:${external_port}"
              exec /etc/confluent/docker/run
          env:
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@ledgerline-kafka-0.ledgerline-kafka.ledgerline.svc.cluster.local:9093,2@ledgerline-kafka-1.ledgerline-kafka.ledgerline.svc.cluster.local:9093,3@ledgerline-kafka-2.ledgerline-kafka.ledgerline.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: CLUSTER_ID
              value: "ZWRnZXJsaW5lTG9jYWwxMg"
          volumeMounts:
            - name: kafkadata
              mountPath: /var/lib/kafka/data
          # kafka-broker-api-versions is itself a JVM tool (it starts a real
          # JVM to make one admin request), not a lightweight shell command --
          # kubectl's exec probe default timeoutSeconds (1s) is not enough
          # for the JVM to even finish starting, which was killing an
          # otherwise-healthy broker on a false-negative liveness failure.
          # Both probes need an explicit, longer timeout, not the default.
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
  volumeClaimTemplates:
    - metadata:
        name: kafkadata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# One-shot topic creation -- the in-cluster equivalent of docker-compose's
# kafka-init service. A Job rather than anything long-lived, matching the
# original's `restart: "no"` shape exactly.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledgerline-kafka-init
  namespace: ledgerline
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      # Waits for the broker's own DNS record and admin port to actually
      # answer before the real container ever runs -- StatefulSet Running
      # does not imply the broker is accepting connections yet (KRaft
      # startup, or plain DNS propagation for the pod's own hostname, can
      # both still be in progress). Retrying via backoffLimit alone still
      # works eventually, but burns through Job attempts and pod restarts
      # on a condition that's cheap to wait out explicitly instead.
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.8.0
          command:
            - bash
            - -c
            - |
              until kafka-broker-api-versions --bootstrap-server ledgerline-kafka-0.ledgerline-kafka.ledgerline.svc.cluster.local:29092 > /dev/null 2>&1; do
                echo "waiting for kafka broker..."
                sleep 3
              done
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.8.0
          command:
            - bash
            - -c
            - |
              kafka-topics --bootstrap-server ledgerline-kafka-0.ledgerline-kafka.ledgerline.svc.cluster.local:29092 \
                --create --if-not-exists --topic transactions --partitions 3 --replication-factor 3 \
                --config min.insync.replicas=2 && \
              kafka-topics --bootstrap-server ledgerline-kafka-0.ledgerline-kafka.ledgerline.svc.cluster.local:29092 \
                --create --if-not-exists --topic transactions.DLT --partitions 1 --replication-factor 3 \
                --config min.insync.replicas=2
