name: Full chaos run

# The real 10-minute ChaosInvariantTest -- too slow for every push and too
# slow to bundle into the nightly schedule alongside the 2-minute smoke
# test (running both nightly would mean ~15 extra minutes of CI time every
# single night for a signal the smoke test already gives most of), but
# still runnable from CI on demand rather than only ever on someone's local
# machine. workflow_dispatch is the only trigger -- this is deliberately
# not on push or a schedule.
on:
  workflow_dispatch: {}

jobs:
  full-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          config: k8s/kind-config.yaml
          cluster_name: ledgerline

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build processor image
        run: docker build -t ledgerline:dev .

      - name: Load image into kind
        run: kind load docker-image ledgerline:dev --name ledgerline

      - name: Install the chart
        run: |
          helm install ledgerline helm/ledgerline -n ledgerline --create-namespace --timeout 5m

      - name: Wait for processor rollout
        run: kubectl rollout status deployment/ledgerline-processor -n ledgerline --timeout=180s

      - name: Run full 10-minute chaos test
        run: ./mvnw -B test -Dtest=ChaosInvariantTest#chaosRunHoldsTheInvariantContinuouslyAndLosesNothing -Dledgerline.chaostest=true

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n ledgerline -o wide
          kubectl get events -n ledgerline --sort-by='.lastTimestamp'
          for pod in $(kubectl get pods -n ledgerline -l app=ledgerline-processor -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== $pod ==="
            kubectl logs -n ledgerline "$pod" --tail=200 || true
          done

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-chaos-surefire-reports
          path: target/surefire-reports/
          retention-days: 30
