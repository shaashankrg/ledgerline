name: Nightly

# The ~90s crash test (Testcontainers, no cluster needed) and a 2-minute
# chaos smoke test (needs a real live kind cluster, same mechanism as the
# full chaos run -- see docs/day9-chaos-test.md and docs/day11-reruns.md)
# both run here, nightly, so neither one is an "opt-in test nothing ever
# schedules" that quietly rots between now and whenever someone next
# remembers to run it locally.
on:
  schedule:
    # 09:00 UTC, arbitrary but fixed -- outside any specific timezone's
    # working hours, which is the only property that actually matters for a
    # nightly job.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  crash-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # CrashRecoveryTest spawns a second, real JVM process (java -jar
      # target/ledgerline-*.jar) to simulate a genuine consumer crash --
      # that's the point of the test, not something to fake with an
      # in-process thread. `mvn test` alone never builds that jar; it has
      # to be packaged first.
      - name: Build jar
        run: ./mvnw -B -q package -DskipTests

      - name: Run crash recovery test
        run: ./mvnw -B test -Dtest=CrashRecoveryTest -Dledgerline.crashtest=true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-test-surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  chaos-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          config: k8s/kind-config.yaml
          cluster_name: ledgerline

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build processor image
        run: docker build -t ledgerline:dev .

      - name: Load image into kind
        run: kind load docker-image ledgerline:dev --name ledgerline

      - name: Install the chart
        run: |
          helm install ledgerline helm/ledgerline -n ledgerline --create-namespace --timeout 5m

      - name: Wait for processor rollout
        run: kubectl rollout status deployment/ledgerline-processor -n ledgerline --timeout=180s

      - name: Run 2-minute chaos smoke test
        run: ./mvnw -B test -Dtest=ChaosInvariantTest#chaosSmokeRunHoldsTheInvariantContinuouslyAndLosesNothing -Dledgerline.chaostest=true -Dledgerline.chaossmoke=true

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n ledgerline -o wide
          kubectl get events -n ledgerline --sort-by='.lastTimestamp'
          for pod in $(kubectl get pods -n ledgerline -l app=ledgerline-processor -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== $pod ==="
            kubectl logs -n ledgerline "$pod" --tail=200 || true
          done

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-smoke-surefire-reports
          path: target/surefire-reports/
          retention-days: 14
