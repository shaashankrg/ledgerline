apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-2"
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
    - name: internal
      port: 29092
      targetPort: 29092
---
# pre-install only -- same reasoning as the Postgres StatefulSet in
# templates/postgres/statefulset.yaml: this must exist before migrate/
# kafka-init run on first install, but must not be torn down and recreated
# by hook-delete-policy on every subsequent `helm upgrade`, or the PVC-backed
# persistence Day 7 required would be pointless.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-2"
spec:
  serviceName: {{ .Release.Name }}-kafka
  # Single-broker, deliberately -- see Chart.yaml. Day 10 is where this
  # becomes a 3-broker topology; this chart does not do that work early.
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-kafka
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
            - containerPort: 29092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@{{ include "ledgerline.kafkaBootstrap" . | trimSuffix ":9092" | trimSuffix "\n" }}:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "ledgerline.kafkaBootstrap" . | trimSuffix "\n" }},INTERNAL://{{ include "ledgerline.kafkaInternalBootstrap" . | trimSuffix "\n" }}"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: CLUSTER_ID
              value: "ZWRnZXJsaW5lTG9jYWwxMg"
          volumeMounts:
            - name: kafkadata
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
  volumeClaimTemplates:
    - metadata:
        name: kafkadata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kafkaStorage }}
---
# One-shot topic creation, gated on the broker actually answering first --
# see the raw-manifest version's comment (k8s/manifests/20-kafka.yaml) for
# why the wait-for-kafka initContainer exists rather than relying on
# backoffLimit retries alone.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kafka-init
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
  annotations:
    # pre-install/pre-upgrade, not post-: this must complete before the
    # processor Deployment (a normal, non-hook resource) is created, or the
    # first replicas to start could race the topic actually existing.
    # Weight 1, after the migration Job's weight 0 -- Postgres and Kafka
    # come up in parallel (they're independent, ordinary resources), but
    # among the two pre-install Jobs, migrations completing first is the
    # more natural read even though nothing here strictly depends on that
    # order.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: confluentinc/cp-kafka:7.8.0
          command:
            - bash
            - -c
            - |
              until kafka-broker-api-versions --bootstrap-server {{ include "ledgerline.kafkaInternalBootstrap" . | trimSuffix "\n" }} > /dev/null 2>&1; do
                echo "waiting for kafka broker..."
                sleep 3
              done
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.8.0
          command:
            - bash
            - -c
            - |
              kafka-topics --bootstrap-server {{ include "ledgerline.kafkaInternalBootstrap" . | trimSuffix "\n" }} \
                --create --if-not-exists --topic transactions --partitions {{ .Values.kafka.partitions }} --replication-factor 1 && \
              kafka-topics --bootstrap-server {{ include "ledgerline.kafkaInternalBootstrap" . | trimSuffix "\n" }} \
                --create --if-not-exists --topic transactions.DLT --partitions {{ .Values.kafka.dltPartitions }} --replication-factor 1
