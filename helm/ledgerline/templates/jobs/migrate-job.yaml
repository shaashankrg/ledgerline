# The structural fix for Day 8's Flyway race: three processor replicas
# starting simultaneously would each independently attempt Flyway's
# migration dance. Flyway's own advisory lock prevents them from
# corrupting the schema *if the lock works as intended*, but depending on
# that as the only defense is fragile in a way worth being explicit about --
# see the two-part reasoning below.
#
# (a) Why the race exists at all: spring.flyway.enabled=true runs migrations
# synchronously during Spring context startup, before the application is
# otherwise ready. A Kubernetes Deployment with replicas: 3 gives no
# ordering guarantee between pods -- all three can reach that startup step
# within the same second, each taking its own database connection and each
# independently deciding "the schema history table doesn't have this
# migration yet, I should apply it."
#
# (b) Why "the lock happens to prevent corruption" is a worse foundation
# than "the race is structurally impossible": Flyway's lock still means
# three processes contend for it, two of them block on a database
# connection doing nothing useful while the winner runs, and the *outcome*
# depends on Flyway's locking implementation continuing to behave correctly
# under exactly this concurrency pattern release after release -- an
# assumption this chart would otherwise be making implicitly, forever,
# without ever stating it. Running migrations from this dedicated
# pre-install/pre-upgrade hook instead means there is only ever one process
# that has ever attempted a migration by the time any processor replica's
# container is even created -- not "the lock arbitrated a race that
# happened", but "no race could happen", because Helm's hook ordering
# guarantees this Job runs to completion (or the release fails) before the
# Deployment template is applied at all. The distinction matters because
# the first version degrades gracefully only as long as an assumption about
# a dependency's internals keeps holding; the second doesn't depend on that
# assumption existing in the first place.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "ledgerline.postgresHost" . | trimSuffix "\n" }} -U ledgerline -d ledgerline; do
                echo "waiting for postgres..."
                sleep 3
              done
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--spring.profiles.active=migrate"]
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "ledgerline.postgresHost" . | trimSuffix "\n" }}:5432/ledgerline"
            - name: SPRING_DATASOURCE_USERNAME
              value: ledgerline
            - name: SPRING_DATASOURCE_PASSWORD
              value: ledgerline
