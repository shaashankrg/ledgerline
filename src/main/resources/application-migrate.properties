# Profile for the dedicated migration Job (Helm pre-install/pre-upgrade
# hook): runs Flyway, then exits. No web server, no consumer, and no
# reconciliation work -- this process does exactly one thing.
#
# spring.flyway.enabled=true is already the application.properties default,
# restated here explicitly so intent reads locally: this is the one place in
# the deployment that is SUPPOSED to run migrations. The processor
# Deployment overrides it to false (SPRING_FLYWAY_ENABLED=false in the Helm
# template) specifically so three replicas starting simultaneously never
# attempt Flyway's migration dance at all -- not "the lock prevents them from
# corrupting anything if they try", but "they structurally cannot try",
# because by the time any replica pod exists, this Job has already completed
# and Helm's hook ordering guaranteed that ordering. See helm/templates/
# migrate-job.yaml for the hook wiring and the full race-condition writeup.
spring.main.web-application-type=none
ledgerline.consumer.enabled=false
spring.flyway.enabled=true
