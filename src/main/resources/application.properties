spring.application.name=ledgerline

spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline
spring.datasource.username=ledgerline
spring.datasource.password=ledgerline

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Splits /actuator/health into /actuator/health/liveness and
# /actuator/health/readiness -- Kubernetes' liveness and readiness probes are
# different questions ("should this process be restarted?" vs "should this
# replica currently receive work?") and must be answered by different
# checks, not the same aggregate endpoint. Liveness stays Spring Boot's
# default (process/JVM alive). Readiness additionally includes the custom
# KafkaConsumerGroupHealth indicator so a replica whose consumer group
# membership is mid-rebalance -- and therefore structurally cannot process
# any partition right now -- is taken out of rotation, without Kubernetes
# ever considering it unhealthy enough to restart.
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# Spring Boot's readiness group defaults to just readinessState -- the
# built-in "has the application finished starting and not been told to stop
# accepting traffic" signal. kafkaConsumerGroupHealth (the bean name Spring
# derives from the KafkaConsumerGroupHealth class -- lowercased first letter,
# no HealthIndicator/HealthContributor suffix to strip since the class name
# doesn't end in either) has to be added explicitly, or the custom indicator
# would exist and be queryable at /actuator/health but never actually gate
# the /actuator/health/readiness endpoint Kubernetes's readiness probe reads.
management.endpoint.health.group.readiness.include=readinessState,kafkaConsumerGroupHealth

# How often ledger_invariant_delta_minor and ledger_unbalanced_accounts are
# recomputed. The underlying query is O(entries), so this runs on a schedule
# and caches the result rather than running per Prometheus scrape -- see
# LedgerInvariantGauges.
ledgerline.metrics.invariant-check-interval=15s
