spring.application.name=ledgerline

spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline
spring.datasource.username=ledgerline
spring.datasource.password=ledgerline

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# How often ledger_invariant_delta_minor and ledger_unbalanced_accounts are
# recomputed. The underlying query is O(entries), so this runs on a schedule
# and caches the result rather than running per Prometheus scrape -- see
# LedgerInvariantGauges.
ledgerline.metrics.invariant-check-interval=15s
