# Profile for LoadRampCommand: a one-shot publisher, not a server.
# No web server and no consumer -- this process only produces load against a
# separately-running consumer (the actual thing being load tested). Without
# ledgerline.consumer.enabled=false, this JVM would start its own competing
# consumer in the same group and split partitions with the process actually
# being measured, silently changing what the ramp was even testing.
spring.main.web-application-type=none
ledgerline.consumer.enabled=false
