# Profile for ReconciliationRunCommand: a one-shot batch job, not a server.
# No web server and no consumer -- this process only reconciles unprocessed
# settlement batches, then exits with a code reflecting whether every batch
# succeeded (see ReconciliationRunCommand's own comment on why that matters
# for a CronJob specifically).
spring.main.web-application-type=none
ledgerline.consumer.enabled=false
